[project]
name = "findarium"
version = "0.1.0"
description = "Local desktop document indexing and semantic search"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "watchdog>=6.0",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "markdown-it-py>=3.0",
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.4",
    "jieba>=0.42",
    "rapidfuzz>=3.10",
    "numpy>=2.2",
    "fastembed>=0.7",
    "olefile>=0.47",
    "platformdirs>=4.3",
    "pywebview>=6.0",
]

[project.scripts]
findarium = "findarium.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "pyinstaller>=6.12",
    "pillow>=11.0",
]

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "findarium"

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
